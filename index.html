<script>

// ✅ ORIGINAL RESULTS (unchanged except Bosnia fix)
const RESULTS = [
  { home:"Mexico",away:"South Korea",homeScore:null,awayScore:null },
  { home:"Mexico",away:"Czechia",homeScore:null,awayScore:null },
  { home:"Mexico",away:"South Africa",homeScore:null,awayScore:null },
  { home:"South Korea",away:"Czechia",homeScore:null,awayScore:null },
  { home:"South Korea",away:"South Africa",homeScore:null,awayScore:null },
  { home:"Czechia",away:"South Africa",homeScore:null,awayScore:null },

  { home:"Canada",away:"Qatar",homeScore:null,awayScore:null },
  { home:"Canada",away:"Switzerland",homeScore:null,awayScore:null },
  { home:"Canada",away:"Bosnia & Herz.",homeScore:null,awayScore:null },
  { home:"Qatar",away:"Switzerland",homeScore:null,awayScore:null },
  { home:"Qatar",away:"Bosnia & Herz.",homeScore:null,awayScore:null },
  { home:"Switzerland",away:"Bosnia & Herz.",homeScore:null,awayScore:null }
];

// ✅ NEW: metadata for sorting + matchdays
const FIXTURE_META=new Map();
RESULTS.forEach((r,i)=>{
  FIXTURE_META.set(`${r.home}|${r.away}`,{
    order:i,
    matchday:Math.floor(i/2)+1,
    date:r.date||null,
    time:r.time||null
  });
});
