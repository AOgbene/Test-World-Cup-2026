<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Sweepstake</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body{background:#0A2E1A;color:#F5F5F0;font-family:Inter,sans-serif;margin:0}
.site-header{padding:16px;border-bottom:1px solid #1E4A2A}
.site-title{font-family:'Bebas Neue';color:#FFD700;font-size:28px}
.nav-tabs{display:flex;border-bottom:1px solid #1E4A2A}
.nav-tab{flex:1;text-align:center;padding:10px;cursor:pointer;color:#AAA}
.nav-tab.active{color:#FFD700;border-bottom:2px solid #FFD700}
.tab-content{display:none;padding:16px}
.tab-content.active{display:block}

.fixture-card{
  background:#112B1C;
  border:1px solid #1E4A2A;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}
.fixture-meta{font-size:11px;color:#AAA;display:flex;justify-content:space-between}
.fixture-team{font-weight:600}
.fixture-teams{display:flex;justify-content:space-between;align-items:center}
.fixture-score{font-family:'Bebas Neue';color:#FFD700;font-size:20px}

.today-match{
  border-color:#FFD700;
  box-shadow:0 0 10px rgba(255,215,0,0.5);
}
.stage-title{
  font-family:'Bebas Neue';
  color:#FFD700;
  font-size:18px;
  margin:20px 0 10px;
}
</style>
</head>

<body>

<div class="site-header">
  <div class="site-title">⚽ World Cup 2026</div>
</div>

<div class="nav-tabs">
  <div class="nav-tab active" onclick="showTab('fixtures',this)">Fixtures</div>
</div>

<div id="tab-fixtures" class="tab-content active"></div>

<script>

// ✅ RESULTS (you can expand this)
const RESULTS = [
  { home:"Mexico", away:"South Korea", matchday:1, date:"2026-06-12", time:"16:00" },
  { home:"Czechia", away:"South Africa", matchday:1, date:"2026-06-12", time:"19:00" },

  { home:"Mexico", away:"Czechia", matchday:2, date:"2026-06-16", time:"16:00" },
  { home:"South Korea", away:"South Africa", matchday:2, date:"2026-06-16", time:"19:00" },

  { home:"Mexico", away:"South Africa", matchday:3, date:"2026-06-20", time:"16:00" },
  { home:"South Korea", away:"Czechia", matchday:3, date:"2026-06-20", time:"19:00" }
];


// ✅ META
const FIXTURE_META = new Map();
RESULTS.forEach((r,i)=>{
  FIXTURE_META.set(`${r.home}|${r.away}`,{
    order:i,
    matchday:r.matchday,
    date:r.date,
    time:r.time
  });
});


// ✅ TIME CONVERSION (UTC → Ireland)
function formatIrishTime(dateStr,timeStr){
  const d = new Date(`${dateStr}T${timeStr}:00Z`);
  return d.toLocaleTimeString('en-IE',{
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  });
}


// ✅ BUILD FIXTURES
const fixtures = RESULTS.map(r=>({
  ...r,
  stage:'group',
  wcGroup:'A'
}));


// ✅ RENDER
function renderFixtures(){

  const sorted = fixtures.sort((a,b)=>{
    const ma = FIXTURE_META.get(`${a.home}|${a.away}`);
    const mb = FIXTURE_META.get(`${b.home}|${b.away}`);

    if(ma.matchday!==mb.matchday){
      return ma.matchday-mb.matchday;
    }
    return ma.order-mb.order;
  });

  const byMatchday = {};
  sorted.forEach(f=>{
    const md = f.matchday;
    if(!byMatchday[md]) byMatchday[md]=[];
    byMatchday[md].push(f);
  });

  let html='';

  Object.entries(byMatchday).forEach(([md,fs])=>{
    html+=`<div class="stage-title">Matchday ${md}</div>`;

    fs.forEach(f=>{
      const meta = FIXTURE_META.get(`${f.home}|${f.away}`);
      const time = formatIrishTime(meta.date,meta.time);

      const today = new Date().toISOString().split('T')[0];
      const isToday = meta.date===today;

      html+=`
      <div class="fixture-card ${isToday?'today-match':''}">
        <div class="fixture-meta">
          <span>${f.home} vs ${f.away}</span>
          <span>${time}</span>
        </div>

        <div class="fixture-teams">
          <div class="fixture-team">${f.home}</div>
          <div class="fixture-score">vs</div>
          <div class="fixture-team">${f.away}</div>
        </div>
      </div>`;
    });

  });

  document.getElementById("tab-fixtures").innerHTML = html;
}


// ✅ NAV
function showTab(name,el){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  el.classList.add('active');
}


// ✅ INIT
document.addEventListener("DOMContentLoaded", renderFixtures);

</script>

</body>
</html>
