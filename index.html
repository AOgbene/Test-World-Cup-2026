<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Sweepstake</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --green-deep:#0A2E1A;
  --green-mid:#1A5C34;
  --gold:#FFD700;
  --white:#F5F5F0;
  --grey-mid:#AAAAAA;
  --card-bg:#112B1C;
  --card-border:#1E4A2A;
}

body{
  background:var(--green-deep);
  color:var(--white);
  font-family:'Inter',sans-serif;
  margin:0;
}

.site-header{
  padding:16px;
  border-bottom:1px solid var(--card-border);
}
.site-title{
  font-family:'Bebas Neue';
  font-size:28px;
  color:var(--gold);
}

.nav-tabs{
  display:flex;
  border-bottom:2px solid var(--card-border);
}
.nav-tab{
  flex:1;
  text-align:center;
  padding:12px;
  font-size:12px;
  color:var(--grey-mid);
  cursor:pointer;
}
.nav-tab.active{
  color:var(--gold);
  border-bottom:3px solid var(--gold);
}

.tab-content{
  display:none;
  padding:16px;
}
.tab-content.active{display:block}

/* ✅ FIXTURES */
.fixture-card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}
.fixture-meta{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--grey-mid);
}
.fixture-teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.fixture-score{
  font-family:'Bebas Neue';
  font-size:20px;
  color:var(--gold);
}

/* ✅ MATCHDAY */
.stage-title{
  font-family:'Bebas Neue';
  font-size:20px;
  color:var(--gold);
  margin:20px 0 10px;
}

/* ✅ TODAY */
.today-match{
  border-color:var(--gold);
  box-shadow:0 0 12px rgba(255,215,0,0.4);
}

/* ✅ LEADERBOARD */
.leaderboard{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:10px 0;
}
.lb-card{
  background:var(--card-bg);
  padding:8px;
  border-radius:8px;
  min-width:80px;
  text-align:center;
}
.lb-pts{
  font-family:'Bebas Neue';
  font-size:20px;
  color:var(--gold);
}
</style>
</head>

<body>

<div class="site-header">
  <div class="site-title">⚽ World Cup 2026</div>
  <div class="leaderboard" id="leaderboard"></div>
</div>

<div class="nav-tabs">
  <div class="nav-tab active" onclick="showTab('fixtures',this)">Fixtures</div>
  <div class="nav-tab" onclick="showTab('groups',this)">Groups</div>
</div>

<div id="tab-fixtures" class="tab-content active"></div>
<div id="tab-groups" class="tab-content"></div>

<script>

/* ✅ GROUPS */
const WC_GROUPS={
A:["Mexico","South Korea","Czechia","South Africa"],
B:["Canada","Qatar","Switzerland","Bosnia & Herz."]
};

/* ✅ RESULTS WITH MATCHDAY + UTC TIME */
const RESULTS=[
{home:"Mexico",away:"South Korea",matchday:1,date:"2026-06-12",time:"16:00"},
{home:"Czechia",away:"South Africa",matchday:1,date:"2026-06-12",time:"19:00"},

{home:"Mexico",away:"Czechia",matchday:2,date:"2026-06-16",time:"16:00"},
{home:"South Korea",away:"South Africa",matchday:2,date:"2026-06-16",time:"19:00"},

{home:"Mexico",away:"South Africa",matchday:3,date:"2026-06-20",time:"16:00"},
{home:"South Korea",away:"Czechia",matchday:3,date:"2026-06-20",time:"19:00"}
];

/* ✅ META */
const META=new Map();
RESULTS.forEach((r,i)=>{
  META.set(`${r.home}|${r.away}`,{
    order:i,
    matchday:r.matchday,
    date:r.date,
    time:r.time
  });
});

/* ✅ TIME CONVERSION */
function irishTime(d,t){
  if(!d||!t)return '';
  return new Date(`${d}T${t}:00Z`)
    .toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit',hour12:false});
}

/* ✅ BUILD FIXTURES */
function buildFixtures(){
  const f=[];
  Object.entries(WC_GROUPS).forEach(([g,teams])=>{
    for(let i=0;i<teams.length;i++){
      for(let j=i+1;j<teams.length;j++){
        f.push({group:g,home:teams[i],away:teams[j]});
      }
    }
  });
  return f;
}

const fixtures=buildFixtures();

/* ✅ FIXTURES RENDER */
function renderFixtures(){

  const sorted=fixtures.sort((a,b)=>{
    const A=META.get(`${a.home}|${a.away}`)||{};
    const B=META.get(`${b.home}|${b.away}`)||{};

    if(A.matchday!==B.matchday) return (A.matchday||99)-(B.matchday||99);
    return (A.order||999)-(B.order||999);
  });

  const grouped={};
  sorted.forEach(f=>{
    const m=META.get(`${f.home}|${f.away}`)||{};
    const md=m.matchday||99;
    if(!grouped[md])grouped[md]=[];
    grouped[md].push(f);
  });

  let html='';

  Object.entries(grouped).sort((a,b)=>a[0]-b[0]).forEach(([md,fs])=>{
    html+=`<div class="stage-title">Matchday ${md}</div>`;

    fs.forEach(f=>{
      const m=META.get(`${f.home}|${f.away}`)||{};
      const time=irishTime(m.date,m.time);

      const today=new Date().toISOString().split('T')[0];
      const isToday=m.date===today;

      html+=`
      <div class="fixture-card ${isToday?'today-match':''}">
        <div class="fixture-meta">
          <span>Group ${f.group} · ${time}</span>
          ${isToday ? `<span style="color:#FFD700">TODAY</span>` : ""}
        </div>
        <div class="fixture-teams">
          <div>${f.home}</div>
          <div class="fixture-score">vs</div>
          <div>${f.away}</div>
        </div>
      </div>`;
    });
  });

  document.getElementById("tab-fixtures").innerHTML=html;
}

/* ✅ GROUP TAB */
function renderGroups(){
  let html='';
  Object.entries(WC_GROUPS).forEach(([g,teams])=>{
    html+=`<div class="stage-title">Group ${g}</div>`;
    teams.forEach(t=>{html+=`<div>${t}</div>`});
  });
  document.getElementById("tab-groups").innerHTML=html;
}

/* ✅ LEADERBOARD (placeholder working) */
function renderLeaderboard(){
  document.getElementById("leaderboard").innerHTML=`
    <div class="lb-card"><div>Mel</div><div class="lb-pts">0</div></div>
    <div class="lb-card"><div>Liam</div><div class="lb-pts">0</div></div>
  `;
}

/* ✅ NAV */
function showTab(id,el){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  el.classList.add('active');
}

/* ✅ INIT */
document.addEventListener("DOMContentLoaded",()=>{
  renderLeaderboard();
  renderFixtures();
  renderGroups();
});

</script>

</body>
</html>
