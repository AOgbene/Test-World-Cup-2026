<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Sweepstake</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --green-deep: #0A2E1A; --green-mid: #1A5C34; --gold: #FFD700;
    --white: #F5F5F0; --grey-light: #E8E8E4; --grey-mid: #AAAAAA;
    --red: #E63946; --card-bg: #112B1C; --card-border: #1E4A2A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--green-deep); color: var(--white); font-family: 'Inter', sans-serif; font-size: 15px; min-height: 100vh; }

  .site-header { padding: 16px; border-bottom: 1px solid var(--card-border); }
  .site-title { font-family: 'Bebas Neue'; font-size: 28px; color: var(--gold); }

  .nav-tabs { display: flex; border-bottom: 2px solid var(--card-border); }
  .nav-tab { flex: 1; padding: 12px; text-align: center; color: var(--grey-mid); cursor: pointer; }
  .nav-tab.active { color: var(--gold); border-bottom: 3px solid var(--gold); }

  .tab-content { display: none; padding: 16px; }
  .tab-content.active { display: block; }

  .stage-title { font-family:'Bebas Neue'; font-size:20px; color:var(--gold); margin:16px 0 10px; }

  .fixture-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; padding:12px; margin-bottom:8px; }
  .fixture-meta { display:flex; justify-content:space-between; font-size:11px; color:var(--grey-mid); }
  .fixture-teams { display:flex; justify-content:space-between; align-items:center; }
  .fixture-score { font-family:'Bebas Neue'; font-size:20px; color:var(--gold); }

  .today-match {
    border-color: var(--gold);
    box-shadow: 0 0 10px rgba(255,215,0,0.4);
  }
</style>
</head>

<body>

<div class="site-header">
  <div class="site-title">⚽ World Cup 2026</div>
</div>

<div class="nav-tabs">
  <div class="nav-tab active" onclick="showTab('fixtures',this)">Fixtures</div>
</div>

<div id="tab-fixtures" class="tab-content active"></div>

<script>

// ✅ ORIGINAL RESULTS (unchanged except Bosnia fix)
const RESULTS = [
  { home:"Mexico", away:"South Korea", homeScore:null, awayScore:null },
  { home:"Mexico", away:"Czechia", homeScore:null, awayScore:null },
  { home:"Mexico", away:"South Africa", homeScore:null, awayScore:null },
  { home:"South Korea", away:"Czechia", homeScore:null, awayScore:null },
  { home:"South Korea", away:"South Africa", homeScore:null, awayScore:null },
  { home:"Czechia", away:"South Africa", homeScore:null, awayScore:null },

  { home:"Canada", away:"Qatar", homeScore:null, awayScore:null },
  { home:"Canada", away:"Switzerland", homeScore:null, awayScore:null },
  { home:"Canada", away:"Bosnia & Herz.", homeScore:null, awayScore:null },
  { home:"Qatar", away:"Switzerland", homeScore:null, awayScore:null },
  { home:"Qatar", away:"Bosnia & Herz.", homeScore:null, awayScore:null },
  { home:"Switzerland", away:"Bosnia & Herz.", homeScore:null, awayScore:null }
];

// ✅ NEW META (order + matchday)
const FIXTURE_META = new Map();
RESULTS.forEach((r,i)=>{
  FIXTURE_META.set(`${r.home}|${r.away}`,{
    order:i,
    matchday: Math.floor(i/2)+1,
    date: r.date || null,
    time: r.time || null
  });
});

// ✅ Irish time helper (only used if you later add time)
function formatIrishTime(dateStr,timeStr){
  if(!dateStr||!timeStr)return '';
  const d=new Date(`${dateStr}T${timeStr}:00Z`);
  return d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit',hour12:false});
}

// ✅ GROUPS
const WC_GROUPS={
  A:["Mexico","South Korea","Czechia","South Africa"],
  B:["Canada","Qatar","Switzerland","Bosnia & Herz."]
};

// ✅ BUILD FIXTURES
function buildFixtures(){
  const f=[];
  Object.entries(WC_GROUPS).forEach(([grp,teams])=>{
    for(let i=0;i<teams.length;i++){
      for(let j=i+1;j<teams.length;j++){
        f.push({stage:'group',wcGroup:grp,home:teams[i],away:teams[j]});
      }
    }
  });
  return f;
}

const fixtures = buildFixtures();

// ✅ UPDATED RENDER (only logic added)
function renderFixturesTab(){

  const sorted = fixtures
    .filter(f=>f.stage==='group')
    .sort((a,b)=>{
      const A=FIXTURE_META.get(`${a.home}|${a.away}`)||{};
      const B=FIXTURE_META.get(`${b.home}|${b.away}`)||{};

      if(A.matchday!==B.matchday){
        return (A.matchday||99)-(B.matchday||99);
      }
      return (A.order||999)-(B.order||999);
    });

  const grouped={};

  sorted.forEach(f=>{
    const meta = FIXTURE_META.get(`${f.home}|${f.away}`)||{};
    const md = meta.matchday||99;
    if(!grouped[md])grouped[md]=[];
    grouped[md].push(f);
  });

  let html='';

  Object.entries(grouped).sort((a,b)=>a[0]-b[0]).forEach(([md,fs])=>{
    html+=`<div class="stage-title">Matchday ${md}</div>`;

    fs.forEach(f=>{
      const meta = FIXTURE_META.get(`${f.home}|${f.away}`)||{};
      const koTime = meta.time ? formatIrishTime(meta.date, meta.time) : '';

      html+=`
      <div class="fixture-card">
        <div class="fixture-meta">
          <span>Group ${f.wcGroup}${koTime ? ' · '+koTime : ''}</span>
        </div>
        <div class="fixture-teams">
          <div>${f.home}</div>
          <div class="fixture-score">vs</div>
          <div>${f.away}</div>
        </div>
      </div>`;
    });
  });

  document.getElementById('tab-fixtures').innerHTML = html;
}

// ✅ NAV
function showTab(name,el){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  el.classList.add('active');
}

// ✅ INIT
document.addEventListener("DOMContentLoaded",renderFixturesTab);

</script>

</body>
</html>
